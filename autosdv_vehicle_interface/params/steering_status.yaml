/**:
  ros__parameters:
    # Publishing rate in Hz
    publish_rate: 30.0

    # Steering response time in seconds
    # Used for smoothing to simulate servo response
    # Lower value = faster response, higher value = more smoothing
    steering_response_time: 0.1

    # NOTE: max_steering_angle is loaded from actuator.yaml via launch file.
    # actuator.yaml is the single source of truth for steering configuration.
