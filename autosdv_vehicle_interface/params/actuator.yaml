/**:
  ros__parameters:
    # Motor controller parameters
    i2c_address: 64
    i2c_busnum: 7
    pwm_freq: 60

    # The publication rate of control commands
    rate: 100.0

    # Debug settings
    enable_debug_publishing: true

    # Dry-run mode for simulation (disables PWM output)
    dry_run: false

    ## PWM parameters (calibrated 2025-11-18)
    # The initial PWM value when the vehicle stops.
    init_pwm: 370
    # The minimum PWM value when the vehicle drives backward at max speed.
    # Note: Vehicle starts moving backward at 385, brake position is 340
    min_pwm: 360
    # The maximum PWM value when the vehicle drives forward at max speed.
    # Note: Vehicle starts moving forward at 395
    max_pwm: 470

    # Brake sequence PWM value (used for forward-to-backward transition)
    brake_pwm: 340

    # Brake threshold - minimum speed to trigger active braking when target is zero
    brake_threshold: 0.2  # m/s - threshold for considering significant motion

    ## Safety (always overrides the speed controller)
    # No usable /control/command/control_cmd for this long -> brake, then neutral;
    # steering centred. Recovers on the next usable command. [s]
    control_cmd_timeout: 0.3
    # Commands whose header stamp is further than this from the node clock are
    # dropped (they do not feed the watchdog). Unstamped (zero) commands pass.
    # A stamp more than 10 s off is reported as a use_sim_time mismatch.
    # 0 disables the check. [s]
    control_cmd_max_stamp_age: 0.5
    # No velocity report for this long -> brake, then neutral (0 disables). [s]
    velocity_timeout: 0.5
    # Longest brake_pwm at the start of an override; neutral afterwards, and at
    # once when the vehicle is already below brake_threshold. [s]
    override_brake_duration: 1.5
    # Brake to a stop on vehicle_cmd_gate's emergency output
    # (~/input/emergency) and on an MRM (~/input/mrm_state).
    enable_emergency_input: true
    # true: stop on ANY operating/succeeded MRM, comfortable stop included.
    # Needed whenever the planner ignores the velocity limit a comfortable stop
    # acts through (the Lab 2 pursuit planner does). false: only on an
    # emergency-stop MRM or a failed MRM, as vehicle_cmd_gate does.
    emergency_stop_on_any_mrm: true
    # Upper bound on the neutral write at shutdown, if the I2C bus hangs. [s]
    neutral_write_timeout: 0.5

    ## Speed controller plug-in (target speed -> motor PWM)
    # Import path "pkg.module:Class" of a class with __init__(params: dict),
    # reset() and update(target_speed, measured_speed, dt) -> int PWM.
    # The default is the PID configured below, unchanged.
    speed_controller_class: "autosdv_vehicle_interface.speed_controller:AckermannSpeedPID"
    # The plug-in's own parameters, as a YAML mapping in a string, merged over
    # this file's motor parameters, e.g. "{kp: 20.0, ki: 4.0}".
    speed_controller_params: ""
    # dt handed to the controller: "velocity_report" = time since the last
    # velocity report (legacy; with 20 Hz reports and a 100 Hz loop it makes
    # the effective integral gain ~3x ki_speed), or "loop" = the loop period.
    speed_controller_dt_source: "velocity_report"
    # After an exception (or a non-numeric output) from the plug-in: motor to
    # neutral for this long, then reset() and retry. [s]
    controller_fault_holdoff: 1.0
    # Faults after which the plug-in stays disabled until restart (0 = never).
    controller_max_faults: 3

    ## Ackermann control - longitudinal
    # PID controller parameters for speed control (outputs PWM offset directly)
    # Output range: -50 to +50 (for PWM range 390±50 = 340-440)
    # Deadzone: 390±5 (385-395 is neutral zone)
    # Forward motion starts at PWM 395, backward at PWM 385
    #
    # NOTE: Velocity measurement uses edge-to-edge timing (smooth, continuous)
    # velocity_report.py already filters with alpha=0.3, so minimal filtering here
    # PID tuned for smooth, stable control with heavily filtered derivative and PWM output
    # PWM output filter (alpha=0.25) and derivative filter (alpha=0.15) provide smoothing
    # Tuning guide:
    #   - Increase kp for more responsive acceleration
    #   - Add ki to eliminate steady-state speed error
    #   - Increase kd to reduce oscillation and overshoot
    # Keep Kp high for fast response, reduce Ki/Kd for steady-state stability
    kp_speed: 12.0
    ki_speed: 10.0
    kd_speed: 0.001

    # Anti-windup configuration
    integral_limit: 50.0                    # Maximum integral accumulation (PWM units)
    enable_conditional_integration: true    # Stop integrating when PWM saturated

    # Deadbands and thresholds
    velocity_deadband: 0.0
    full_stop_threshold: 0.1                # m/s - threshold for considering vehicle stopped

    # Velocity filtering (exponential moving average)
    # Alpha values: 0 = heavy filtering, 1 = no filtering
    # Moderate filtering to balance responsiveness with noise rejection
    velocity_measurement_filter_alpha: 0.9
    velocity_command_filter_alpha: 0.9

    ## Ackermann control - steering
    # The steering limit, wheelbase and track are NOT set here. They come from
    # autosdv_vehicle_description/config/vehicle_info.param.yaml
    # (max_steer_angle, wheel_base, wheel_tread), which the launch file loads
    # into this node. That is the file the planner sizes every trajectory
    # against; a second copy here drifted (0.340 m vs 0.319 m wheelbase,
    # 0.5 rad vs 0.349 rad steering limit) without anything noticing.

    # Maximum steering speed [rad/s]
    steering_speed: 1.0

    # The initial value for the steering servo that makes the vehicle go straight.
    init_steer: 489
    # The minimum control value for steering servo (RIGHT turn - reversed hardware).
    min_steer: 439
    # The maximum control value for steering servo (LEFT turn - reversed hardware).
    max_steer: 539

    # Note: Steering direction is REVERSED in hardware
    # Lower PWM (350) = RIGHT turn, Higher PWM (450) = LEFT turn

    # The ratio between the tire angle and the steer value
    # Positive value to compensate for reversed steering hardware
    tire_angle_to_steer_ratio: -1000.0

    ## Output filtering
    # Derivative filter alpha (0 = heavy filtering, 1 = no filtering)
    # Lower values reduce noise sensitivity in PID derivative term
    derivative_filter_alpha: 0.15
    # PWM output filter alpha (0 = heavy filtering, 1 = no filtering)
    # Smooths PWM output to reduce motor oscillations
    pwm_output_alpha: 0.25
