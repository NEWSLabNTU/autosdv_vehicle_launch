/**:
  ros__parameters:
    # The input GPIO pin number (BOARD numbering). Every car since
    # 2026-10-27, when car A's pin 15 stopped delivering edges (AutoSDV:
    # scripts/testing/speed_control/README.md).
    pin: 16
    
    # The wheel diameter in centimeters.
    wheel_diameter: 10.5
    
    # The number of markers on the wheel.
    markers_per_rotation: 12
    
    # The publication rate of velocity report messages
    rate: 20.0

    # The frame ID marked on output messages
    frame_id: "base_link"

    # Median over this many edge gaps (1 = each gap alone). An edge is timed
    # when its GPIO callback runs, so a late callback makes a long gap and then
    # a short one that reads far too fast; 3 rejects that pair.
    gap_median_window: 3
